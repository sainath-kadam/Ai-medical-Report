# Keeps the free-tier backend and database awake:
#  - Render's free web service sleeps after 15 idle minutes (first request then takes 30-50s)
#  - Supabase pauses a free project after a week without database activity
# Every 10 minutes this calls /api/v1/health/db, which wakes the API and runs `SELECT 1`.
# GitHub may delay scheduled runs by a few minutes and disables them after 60 days with no
# repository activity -- re-enable from the Actions tab if that happens.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + database
        env:
          # Settings > Secrets and variables > Actions > Variables. Falls back to the
          # Render URL netlify.toml proxies to.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://ai-medical-report-ak4w.onrender.com' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$BACKEND_URL/api/v1/health/db"
