server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Signed file URLs (server/app/storage/local.py) are
    # deliberately relative -- the browser resolves them against whatever origin served
    # the page. vite.config.ts proxies /api to the backend for `npm run dev`; this mirrors
    # that same proxy for the docker-compose/nginx deployment, otherwise those <img>/<video>
    # requests hit nginx's own SPA fallback and 200 with index.html instead of the file.
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Study uploads go up to MAX_UPLOAD_MB (1GB) and POST /studies/intake runs AI
        # analysis in-request, so nginx's 1MB body / 60s read defaults would 413 or 504.
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # React Router uses client-side routing — every unknown path falls back to
    # index.html so deep links (e.g. /reports/abc123) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
